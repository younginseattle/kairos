name: Find Jobs

# Read-only lookup for diagnosing "I don't see X in the app" reports.
# Writes nothing. Reuses the same Supabase secrets every other script does.

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Search term — matches against title OR company (case-insensitive substring)'
        required: true

jobs:
  find:
    name: Look up jobs by title/company
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Find jobs
        env:
          VITE_SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/find-jobs.mjs --q="${{ inputs.query }}"
